name: Apply v1.2.3 source

on:
  push:
    branches:
      - v1.2.3-github-sync
    paths:
      - '.source-upload/v1.2.3/**'
      - '.github/workflows/apply-v1.2.3-source.yml'

permissions:
  contents: write

jobs:
  apply-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged source patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.source-upload/v1.2.3/part-*.patch)
          if [ ${#parts[@]} -eq 0 ]; then
            echo 'Patch already applied; nothing to do.'
            exit 0
          fi
          cat "${parts[@]}" > /tmp/manhwa-watcher-v1.2.3.patch

          # The GitHub README and the first few lines of index.html differ slightly
          # from the local v1.1.3 package used to generate the patch. GNU patch still
          # applies every other hunk; the two known rejects are repaired explicitly
          # below instead of weakening validation for the source files.
          set +e
          patch -p1 --forward --batch < /tmp/manhwa-watcher-v1.2.3.patch
          patch_status=$?
          set -e

          if [ "$patch_status" -ne 0 ]; then
            mapfile -t rejects < <(find . -name '*.rej' -print | sort)
            printf 'Patch rejects:\n%s\n' "${rejects[*]:-none}"
            for reject in "${rejects[@]}"; do
              case "$reject" in
                ./README.md.rej|./src/renderer/index.html.rej) ;;
                *) echo "Unexpected patch reject: $reject"; exit 1 ;;
              esac
            done
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = re.sub(r'^# Manhwa Watcher[^\n]*', '# Manhwa Watcher v1.2.3', text, count=1, flags=re.M)
          if '## Online Library (v1.2.3)' not in text:
              text += '''\n\n---\n\n## Online Library (v1.2.3)\n\nThe **Online Library** lets you save large numbers of titles without downloading every chapter. Use **☁ Merken** on a series, open saved titles from **Online-Bibliothek**, and use **Lesen** to read chapters live in the integrated Chromium reader.\n\nRead chapters are tracked as lightweight SQLite metadata and shown with `✓ GELESEN`; no CBZ or chapter images are stored by the online-reading feature. Offline CBZ downloads and Syncthing/Aniyomi sync remain available separately.\n'''
          readme.write_text(text, encoding='utf-8')

          index = Path('src/renderer/index.html')
          text = index.read_text(encoding='utf-8')
          text = re.sub(r'<title>Manhwa Watcher v[^<]+</title>', '<title>Manhwa Watcher v1.2.3</title>', text, count=1)
          text = re.sub(r'<div class="eyebrow" id="versionLabel">[^<]*</div>', '<div class="eyebrow" id="versionLabel">v1.2.3 · Online Library</div>', text, count=1)
          if 'id="onlineLibraryToggleBtn"' not in text:
              needle = '<button id="newsToggleBtn" class="secondary">Neuheiten</button>'
              replacement = needle + '\n      <button id="onlineLibraryToggleBtn" class="secondary">Online-Bibliothek</button>'
              if needle not in text:
                  raise SystemExit('Could not locate newsToggleBtn in index.html')
              text = text.replace(needle, replacement, 1)
          index.write_text(text, encoding='utf-8')
          PY

          find . -name '*.rej' -delete
          find . -name '*.orig' -delete
          rm -rf .source-upload/v1.2.3

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node -e "const p=require('./package.json'); if(p.version!=='1.2.3') throw new Error('Unexpected version '+p.version)"

      - name: Commit updated v1.2.3 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Update source to Manhwa Watcher v1.2.3'
          git push origin HEAD:${GITHUB_REF_NAME}
