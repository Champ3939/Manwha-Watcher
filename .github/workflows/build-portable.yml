name: Build portable Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Syntax check
        shell: pwsh
        run: npm run check

      - name: Build portable EXE
        shell: pwsh
        run: npm run dist

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Manhwa-Watcher-portable
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
