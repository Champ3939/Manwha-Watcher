name: Apply Toomics covers and chapters hotfix once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Toomics covers/chapters and bump v1.2.6
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('src/core/browserService.js')
          s = p.read_text(encoding='utf-8')

          start = s.index("      const imageUrl = (img) => {")
          end = s.index("      const backgroundUrl = (el) => {", start)
          new = """      const imageUrl = (img) => {
            if (!img) return null;
            // Lazy-load sites (notably Toomics) often keep a placeholder in currentSrc/src
            // while the real cover lives in data-src/data-original/srcset. Try every
            // candidate instead of stopping at the first truthy placeholder.
            const candidates = [
              img.currentSrc,
              img.getAttribute('src'),
              img.getAttribute('data-src'),
              img.getAttribute('data-lazy-src'),
              img.getAttribute('data-original'),
              img.getAttribute('data-url'),
              img.getAttribute('data-cfsrc'),
              fromSrcset(img.getAttribute('data-srcset')),
              fromSrcset(img.getAttribute('srcset')),
              fromSrcset(img.closest('picture')?.querySelector('source')?.getAttribute('srcset')),
              fromSrcset(img.closest('picture')?.querySelector('source')?.getAttribute('data-srcset'))
            ].filter(Boolean);
            for (const raw of candidates) {
              const u = abs(raw);
              if (!u || !/^https?:$/.test(u.protocol)) continue;
              if (/transparent|placeholder|spacer|loading|blank\\.(?:gif|png)|1x1/i.test(u.href)) continue;
              return u.href;
            }
            return null;
          };
          """
          s = s[:start] + new + s[end:]

          needle = "        let chapters = [...rows.values()];\n"
          pos = s.index(needle, s.index('async discoverSeriesInfo'))
          insert = """        // Toomics renders episode rows through JavaScript and some variants do not
            // expose the chapter URL as a normal <a href>. The canonical reader route
            // is /<lang>/webtoon/detail/code/<code>/ep/<episode>/toon/<toonId>.
            // Scan the serialized DOM too so data attributes / onclick markup are covered.
            if (/^(?:www\\.|global\\.|comics\\.)?toomics\\.com$/i.test(location.hostname)) {
              const toonMatch = location.pathname.match(/\\/webtoon\\/episode\\/toon\\/(\\d+)/i);
              const toonId = toonMatch?.[1] || null;
              if (toonId) {
                const markup = String(document.documentElement?.innerHTML || '')
                  .replace(/\\\\u002f/gi, '/')
                  .replace(/\\\\\\//g, '/')
                  .replace(/&amp;/gi, '&');
                const routeRx = /(?:https?:\\/\\/[^\\s\"'<>]+)?(\\/(?:[a-z]{2}(?:-[a-z]{2})?\\/)?webtoon\\/detail\\/code\\/(\\d+)\\/ep\\/(\\d+)\\/toon\\/(\\d+))/gi;
                let m;
                while ((m = routeRx.exec(markup))) {
                  if (String(m[4]) !== String(toonId)) continue;
                  const number = Number(m[3]);
                  if (!Number.isFinite(number)) continue;
                  const href = abs(m[1]);
                  if (!href) continue;
                  const existing = rows.get(href);
                  const item = {
                    id: String(number),
                    title: 'Folge ' + number,
                    url: href,
                    number,
                    downloaded: false,
                    score: 180,
                    language: pageLanguage
                  };
                  if (!existing || item.score > existing.score) rows.set(href, item);
                }
              }
            }

          """
          s = s[:pos] + insert + s[pos:]
          p.write_text(s, encoding='utf-8')

          pkg = Path('package.json')
          data = json.loads(pkg.read_text(encoding='utf-8'))
          data['version'] = '1.2.6'
          pkg.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('RELEASE_NOTES_v1.2.6.md').write_text('''# Manhwa Watcher v1.2.6\n\n## Toomics covers and chapters hotfix\n\n- Tries all lazy-load image sources instead of discarding real covers after a placeholder.\n- Adds a Toomics-specific episode fallback for `/webtoon/detail/code/<code>/ep/<episode>/toon/<toonId>` routes.\n- Detects Toomics episode URLs embedded in rendered HTML, data attributes or onclick markup.\n- Keeps all v1.2.5 catalog/status fixes and the v1.2.4 mixed-chapter protection.\n''', encoding='utf-8')
          PY

          node --check src/core/browserService.js
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"

          git config user.name "Champ3939"
          git config user.email "166837043+Champ3939@users.noreply.github.com"
          git add src/core/browserService.js package.json RELEASE_NOTES_v1.2.6.md
          git rm .github/workflows/fix-toomics-covers-chapters-once.yml
          git commit -m "v1.2.6: Fix Toomics covers and chapter detection"
          git push origin main
