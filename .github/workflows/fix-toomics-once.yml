name: Apply Toomics catalog hotfix once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-toomics-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Toomics detection and bump v1.2.5
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('src/core/browserService.js')
          lines = p.read_text(encoding='utf-8').splitlines(True)
          snap = next(i for i, line in enumerate(lines) if 'async _snapshotCatalogPage' in line)

          # Insert Toomics URL rules in the catalog scanner.
          abs_i = next(i for i in range(snap, len(lines)) if 'const abs = (value)' in lines[i])
          toomics_rules = [
              "      const host = String(location.hostname || '').toLowerCase();\n",
              "      const isToomics = host === 'toomics.com' || host.endsWith('.toomics.com');\n",
              "      // Toomics uses /webtoon/ for navigation and series. Only episode/toon/<id> is a title.\n",
              "      const toomicsSeriesPath = /^\\/(?:[a-z]{2}(?:-[a-z]{2})?\\/)?webtoon\\/episode\\/toon\\/\\d+(?:\\/|$)/i;\n",
              "      const toomicsCatalogPath = /^\\/(?:[a-z]{2}(?:-[a-z]{2})?\\/)?webtoon\\/ranking(?:\\/|$)/i;\n",
              "      const toomicsListingPath = /^\\/(?:[a-z]{2}(?:-[a-z]{2})?\\/)?webtoon\\/(?:recent|new_comics|search_v2)(?:\\/|$)/i;\n",
          ]
          lines[abs_i + 1:abs_i + 1] = toomics_rules

          # Normalize series URL variants/query parameters before deduplication.
          canonical_start = next(i for i in range(snap, len(lines)) if 'const canonical = (u) =>' in lines[i])
          canonical_mutate = next(i for i in range(canonical_start, canonical_start + 8) if "u.hash = '';" in lines[i])
          canonical_extra = [
              "        if (isToomics) {\n",
              "          const match = u.pathname.match(/^(\\/(?:[a-z]{2}(?:-[a-z]{2})?\\/)?webtoon\\/episode\\/toon\\/\\d+)/i);\n",
              "          if (match) { u.pathname = match[1]; u.search = ''; }\n",
              "        }\n",
          ]
          lines[canonical_mutate + 1:canonical_mutate + 1] = canonical_extra

          # Ranking is Toomics' actual catalog page.
          cscore_i = next(i for i in range(snap, len(lines)) if "cscore += 55" in lines[i] and 'catalog' in lines[i])
          lines[cscore_i + 1:cscore_i + 1] = ["        if (isToomics && toomicsCatalogPath.test(u.pathname)) cscore += 220;\n"]

          # Do not propose Toomics recent/new/search listing pages as alternative catalogs.
          exclusion_i = next(i for i in range(snap, len(lines)) if 'badPath.test(u.pathname) || chapterText.test(text)' in lines[i] and 'cscore = 0' in lines[i])
          lines[exclusion_i] = "        if (badPath.test(u.pathname) || chapterText.test(text) || (isToomics && toomicsListingPath.test(u.pathname))) cscore = 0;\n"

          # Important: generic badPath contains 'episode', but Toomics puts its SERIES page under /episode/toon/<id>.
          candidate_i = next(i for i in range(snap, len(lines)) if "if (u.pathname === '/'" in lines[i] and 'hasBadQuery' in lines[i])
          lines[candidate_i] = "        if (u.pathname === '/' || (badPath.test(u.pathname) && !(isToomics && toomicsSeriesPath.test(u.pathname))) || hasBadQuery(u)) continue;\n"
          lines[candidate_i + 1:candidate_i + 1] = ["        if (isToomics && !toomicsSeriesPath.test(u.pathname)) continue;\n"]

          explicit_i = next(i for i in range(snap, len(lines)) if 'const explicitSeriesPath = seriesPath.test(u.pathname);' in lines[i])
          lines[explicit_i] = "        const explicitSeriesPath = isToomics ? toomicsSeriesPath.test(u.pathname) : seriesPath.test(u.pathname);\n"

          s = ''.join(lines)

          # German status vocabulary used by Toomics.
          s = s.replace(
              "if (/\\b(?:completed|complete|finished|ended|complete[d]?)\\b/i.test(raw)) return 'completed';",
              "if (/\\b(?:completed|complete|finished|ended|complete[d]?|ende|abgeschlossen|beendet)\\b/i.test(raw)) return 'completed';",
              1
          )
          s = s.replace(
              "if (/\\b(?:ongoing|on going|publishing|releasing|active|serialization|serializing|updating|update in progress)\\b/i.test(raw)) return 'ongoing';",
              "if (/\\b(?:ongoing|on going|publishing|releasing|active|serialization|serializing|updating|update in progress|laufend|fortlaufend|aktualisiert)\\b/i.test(raw) || /\\bfol\\+/i.test(raw)) return 'ongoing';",
              1
          )
          # Same mappings inside the injected renderer-side catalog scanner (escaped regex source).
          s = s.replace(
              "if (/\\\\b(?:completed|complete|finished|ended)\\\\b/i.test(raw)) return 'completed';",
              "if (/\\\\b(?:completed|complete|finished|ended|ende|abgeschlossen|beendet)\\\\b/i.test(raw)) return 'completed';"
          )
          s = s.replace(
              "if (/\\\\b(?:ongoing|on going|publishing|releasing|active|serialization)\\\\b/i.test(raw)) return 'ongoing';",
              "if (/\\\\b(?:ongoing|on going|publishing|releasing|active|serialization|laufend|fortlaufend|aktualisiert)\\\\b/i.test(raw) || /\\\\bfol\\\\+/i.test(raw)) return 'ongoing';"
          )

          p.write_text(s, encoding='utf-8')

          pkg = Path('package.json')
          data = json.loads(pkg.read_text(encoding='utf-8'))
          data['version'] = '1.2.5'
          pkg.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('RELEASE_NOTES_v1.2.5.md').write_text('''# Manhwa Watcher v1.2.5\n\n## Toomics catalog hotfix\n\n- Uses `/de/webtoon/ranking` as the Toomics catalog.\n- Accepts only `/webtoon/episode/toon/<id>` as real Toomics series links.\n- Filters navigation entries such as Genres, My Library, New and Search from the series list.\n- Normalizes Toomics title URL variants before deduplication.\n- Recognizes German Toomics status hints such as `Ende`, `Abgeschlossen`, `Aktualisiert` and `Fol+`.\n''', encoding='utf-8')
          PY

          node --check src/core/browserService.js
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"

          git config user.name "Champ3939"
          git config user.email "166837043+Champ3939@users.noreply.github.com"
          git add src/core/browserService.js package.json RELEASE_NOTES_v1.2.5.md
          git rm .github/workflows/fix-toomics-once.yml
          git commit -m "v1.2.5: Fix Toomics catalog detection"
          git push origin main
